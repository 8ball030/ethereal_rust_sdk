[package]
name = "ethereal_rust_sdk"
version = "0.2.2"
edition = "2018"
description = "Trading client for Ethereal exchange"
repository = "https://github.com/8ball030/ethereal_rust_sdk"
readme = "readme.md"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
serde_repr = "0.1"

reqwest = {version = "0.13.5", features = ["json", "query"]}
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde"] }

simple_logger = "5.2.0"
log = "0.4.34"
anyhow = "1.0.104"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["sync", "rt-multi-thread", "macros"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
yawc = { version = "0.5.0", default-features = false, features = ["rustls-aws-lc-rs", "reqwest"] }
dashmap = "6.2.1"
bytes = "1.12.1"
thiserror = "2.0.21"
alloy-primitives = { version = "1.7.3", features = ["serde"] }
alloy-dyn-abi = "1.7.3"
alloy-signer = "2.5.0"
alloy-signer-local = "2.5.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
csv = "1.4.0"
tokio-test = "0.4"

[[bench]]
name = "json_parsing"
harness = false

[[bench]]
name = "subscription_handling"
harness = false

[[bench]]
name = "serialization"
harness = false

[[bench]]
name = "connect_latency"
harness = false

[[bench]]
name = "signing"
harness = false
